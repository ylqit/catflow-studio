[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "catflow-studio"
version = "0.1.0"
description = "Local-first web studio for original child-and-cat life clips"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "volcengine-python-sdk[ark]>=5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
catflow = "catflow.interfaces.cli:app"
catflow-worker = "catflow_worker.cli:app"

[tool.hatch.build.targets.wheel]
packages = [
  "services/api/src/catflow",
  "services/worker/src/catflow_worker",
]

[tool.pytest.ini_options]
pythonpath = [
  "services/api/src",
  "services/worker/src",
]
testpaths = ["tests/catflow", "tests/contract", "tests/e2e", "tests/consistency"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/api/src", "services/worker/src", "tests/catflow", "tests/contract"]
include = [
  "services/api/**/*.py",
  "services/worker/**/*.py",
  "tests/catflow/**/*.py",
  "tests/contract/**/*.py",
  "tests/e2e/**/*.py",
  "tests/consistency/**/*.py",
  "scripts/export_openapi.py",
  "scripts/import_legacy_assets.py",
  "scripts/local_backup.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM"]
ignore = ["B008"]
