[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cat-video-generator"
version = "0.1.0"
description = "Local scene and shot-card AIGC video production system"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "volcengine-python-sdk[ark]>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
cvg = "cat_video_generator.interfaces.cli:main"
cvg-media-worker = "cat_video_generator.media_worker:main"
cvg-worker = "cat_video_generator.media_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_video_generator"]
